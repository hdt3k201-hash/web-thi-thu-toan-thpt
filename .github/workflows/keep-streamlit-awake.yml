name: Keep Streamlit Apps Awake

# Chạy tự động mỗi 10 phút để ping tất cả app, tránh bị Streamlit Cloud đưa vào trạng thái sleep.
# Có thể chạy thủ công từ tab Actions trên GitHub (nút "Run workflow").
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  ping-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app_tohop_xacsuat.py
        run: |
          curl -sS -o /dev/null -w "app_tohop_xacsuat.py -> HTTP %{http_code}\n" \
            "https://web-thi-thu-toan-thpt-tohopxacsuat.streamlit.app/" || echo "app_tohop_xacsuat.py: request failed"

      - name: Ping app_dungsai_hamso.py
        run: |
          curl -sS -o /dev/null -w "app_dungsai_hamso.py -> HTTP %{http_code}\n" \
            "https://web-thi-thu-toan-thpt-dungsaihamso.streamlit.app/" || echo "app_dungsai_hamso.py: request failed"

      - name: Ping app_nganhang_hamso.py
        run: |
          curl -sS -o /dev/null -w "app_nganhang_hamso.py -> HTTP %{http_code}\n" \
            "https://web-thi-thu-toan-thpt-nganhanghamso.streamlit.app/" || echo "app_nganhang_hamso.py: request failed"

      - name: Ping app_nguyenham_tichphan.py
        run: |
          curl -sS -o /dev/null -w "app_nguyenham_tichphan.py -> HTTP %{http_code}\n" \
            "https://web-thi-thu-toan-thpt-nguyenhamtichphan.streamlit.app/" || echo "app_nguyenham_tichphan.py: request failed"

      - name: Ping app_sohoc_tsa.py
        run: |
          curl -sS -o /dev/null -w "app_sohoc_tsa.py -> HTTP %{http_code}\n" \
            "https://web-thi-thu-toan-thpt-sohoctsa.streamlit.app/" || echo "app_sohoc_tsa.py: request failed"

      - name: Ping app_theochuong.py
        run: |
          curl -sS -o /dev/null -w "app_theochuong.py -> HTTP %{http_code}\n" \
            "https://thi-thu-toan-12-theo-chuong-thaytung.streamlit.app/" || echo "app_theochuong.py: request failed"

      - name: Ping app_thihocky.py
        run: |
          curl -sS -o /dev/null -w "app_thihocky.py -> HTTP %{http_code}\n" \
            "https://web-thi-thu-toan-thpt-thihocky.streamlit.app/" || echo "app_thihocky.py: request failed"

      - name: Ping app_tracnghiem_hamso.py
        run: |
          curl -sS -o /dev/null -w "app_tracnghiem_hamso.py -> HTTP %{http_code}\n" \
            "https://web-thi-thu-toan-thpt-tracnghiemhamso.streamlit.app/" || echo "app_tracnghiem_hamso.py: request failed"

      - name: Ping app_hsa.py
        run: |
          curl -sS -o /dev/null -w "app_hsa.py -> HTTP %{http_code}\n" \
            "https://toanthaytung-hsa.streamlit.app/" || echo "app_hsa.py: request failed"

      # Chưa có URL của app.py (app chính) — thêm khối sau khi có link:
      # - name: Ping app.py
      #   run: |
      #     curl -sS -o /dev/null -w "app.py -> HTTP %{http_code}\n" \
      #       "https://URL-CUA-APP-CHINH.streamlit.app/" || echo "app.py: request failed"

      
